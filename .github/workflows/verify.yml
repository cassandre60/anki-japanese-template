name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test-only deps (compactor)
        run: pip install beautifulsoup4 soupsieve
      - name: Install Japanese fonts (layout probes measure real CJK glyphs)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Run local quality gate
        run: ./verify
